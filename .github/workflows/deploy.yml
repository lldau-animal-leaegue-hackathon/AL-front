# main 에서 CI 가 성공하면 → Actions 가 이미지를 빌드해 Docker Hub 로 올리고,
# 서버는 pull 만 한다 (사용자 결정 2026-08-20 — deploy key 없이).
#
# 서버에서 빌드하지 않는 이유: 디스크·CPU 를 다른 서비스와 나눠 쓰는 단일 서버라
# 빌드 부하를 CI 로 옮긴다. 부수 효과로 GitHub deploy key(서버→클론)가 통째로 불필요.
#
# SSH 단계의 키는 서버 authorized_keys 의 forced command 로 **배포 스크립트만
# 실행할 수 있게 묶여 있다** — 키가 새어도 서버에서 임의 명령을 못 돌린다.
#
# 필요한 저장소 시크릿(Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  Docker Hub 사용자명
#   DOCKERHUB_TOKEN     Docker Hub 액세스 토큰(Read & Write)
#   DEPLOY_HOST         서버 주소
#   DEPLOY_USER         SSH 사용자
#   DEPLOY_SSH_KEY      전용 개인 키(forced command 로 제한된 키)

name: Deploy

# push 직결이면 CI 와 병렬 독립이라 시크릿 스캔·린트·빌드가 실패한 커밋도
# 배포된다 — CI 완주(성공)를 게이트로 삼는다. 성공 여부는 잡의 if 에서 거른다
# (types: completed 는 실패·취소로 끝나도 발화한다).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 연달아 머지돼도 배포는 한 번에 하나씩.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push:
    # main 의 CI 가 성공했을 때만. deploy 잡은 needs 로 이 게이트를 물려받는다.
    #
    # ⚠️ conclusion 조건만 두면 안 된다. workflow_run 의 `branches: [main]` 필터는
    #    트리거한 실행의 **head branch 이름**만 본다 — fork 의 브랜치 이름이 `main` 이면
    #    fork PR 로 돈 CI 도 이 필터를 통과한다. 그 상태로 아래 잡이 돌면 공격자 커밋
    #    (head_sha)을 checkout 해 DOCKERHUB_TOKEN·DEPLOY_SSH_KEY 로 youtine:latest 를
    #    덮어쓰고, 서버가 그것을 pull 한다(컨테이너에는 DB 자격 증명과 ~/.claude 가 마운트).
    #    아래 두 줄 중 하나라도 지우면 그 경로가 다시 열린다.
    #      - event == 'push'      : 푸시로 돈 CI 만 배포 게이트로 인정(PR 발 CI 는 배제)
    #      - head_repository 대조 : 이 레포에서 시작한 실행만 인정(fork 배제)
    #    2026-08-21 현재 레포가 비공개라 외부 fork PR 자체가 불가능해 즉시 악용은 안 되지만,
    #    **공개로 전환하는 순간 유효해지는 구멍**이라 미리 닫아 둔다.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 이벤트의 기본 checkout 은 기본 브랜치 최신 커밋이다 —
          # CI 를 통과한 바로 그 커밋을 빌드하도록 head_sha 로 고정한다.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest = 배포 대상, sha = 롤백 지점. 서버는 latest 만 pull 한다.
          # sha 태그도 checkout 과 같은 head_sha 기준 — github.sha 는 이 이벤트에선
          # 기본 브랜치 최신이라 빌드된 내용과 어긋날 수 있다.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/youtine:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/youtine:${{ github.event.workflow_run.head_sha }}
          # GitHub Actions 캐시 — 의존성이 안 바뀌면 재빌드가 분 단위로 준다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⛔ appleboy/ssh-action 을 쓰지 않는다(2026-08-20 실측): forced-command 키와
      #    상성이 나빠 "서버에서 스크립트는 완주했는데 액션은 실패"(run #4) 또는
      #    "접속 자체가 안 됨"(run #5·#6) 이 났다. 순정 ssh 는 같은 키·같은 경로로
      #    수동 실측에서 exit 0 으로 완주했다 — 그대로 재현한다.
      - name: 서버에서 pull + 재기동 (forced command → deploy.sh)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          # 실행 명령("deploy")은 장식이다 — authorized_keys 의 forced command 가
          # 항상 배포 스크립트를 실행한다. 키가 새어도 임의 명령은 불가능하다.
          ssh -i key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" deploy
          rm -f key
