# main 푸시/머지 → 서버에서 Docker 빌드·기동 (사용자 결정 2026-08-20)
#
# 동작: SSH 로 서버에 접속만 한다. 실제 절차는 서버의 배포 스크립트가 전부 갖고 있고,
# 그 키는 authorized_keys 의 forced command 로 **배포 스크립트만 실행할 수 있게 묶여
# 있다** — 시크릿 키가 새어도 서버에서 임의 명령을 못 돌린다.
#
# 필요한 저장소 시크릿(Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     서버 주소
#   DEPLOY_USER     SSH 사용자
#   DEPLOY_SSH_KEY  전용 개인 키(forced command 로 제한된 키)

name: Deploy

on:
  push:
    branches: [main]

# 연달아 머지돼도 배포는 한 번에 하나씩 — 서버에서 build 가 겹치면 디스크·CPU 를 다툰다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 배포 스크립트 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # forced command 키라 아래 script 는 사실상 장식이다 — 서버가 항상
          # 배포 스크립트만 실행한다. 문서화를 위해 같은 경로를 적는다.
          script: /home/ubuntu/youtine/deploy.sh
          command_timeout: 15m
