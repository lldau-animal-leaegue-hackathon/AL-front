name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# 같은 브랜치에 새 커밋이 올라오면 진행 중이던 이전 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `next typegen` 이 .next/types 를 만들어야 tsc 가 통과합니다.
      # (typecheck 스크립트가 typegen 을 먼저 실행합니다)
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
